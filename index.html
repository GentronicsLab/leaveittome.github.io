<!DOCTYPE html>
<html>

<head>
    <title>Leave it to me</title>
    <style>
        body {
            background-image: url('unsure.png');
            background-repeat: no-repeat;
            background-size: 100% 100%;
            background-attachment: fixed;
        }

        h1 {
    color: rgb(19, 217, 231);
    position: absolute;
    top: 8%; /* Adjusted higher (was 15%) */
    left: 50%; /* Centers the anchor point horizontally */
    transform: translateX(-50%); /* Offsets by 50% width to achieve true center */
    font-size: 40px;
    
    background-color: rgba(0, 0, 0, 0.5); /* 50% transparent background */
    padding: 10px 20px;
    border-radius: 8px;
    white-space: nowrap; /* Keeps heading on a single line */
}

        #redirect-button {
            position: absolute;
            top: 32%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20px;
        }

        /* CSS */
        button {
            padding: 0.6em 2em;
            border: none;
            outline: none;
            color: rgb(255, 255, 255);
            background: #111;
            cursor: pointer;
            position: relative;
            z-index: 0;
            border-radius: 10px;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        button:before {
            content: "";
            background: linear-gradient(45deg,
                    #ff0000,
                    #ff7300,
                    #fffb00,
                    #48ff00,
                    #00ffd5,
                    #002bff,
                    #7a00ff,
                    #ff00c8,
                    #ff0000);
            position: absolute;
            top: -2px;
            left: -2px;
            background-size: 400%;
            z-index: -1;
            filter: blur(5px);
            -webkit-filter: blur(5px);
            width: calc(100% + 4px);
            height: calc(100% + 4px);
            animation: glowing-button-85 20s linear infinite;
            transition: opacity 0.3s ease-in-out;
            border-radius: 10px;
        }

        @keyframes glowing-button-85 {
            0% {
                background-position: 0 0;
            }

            50% {
                background-position: 400% 0;
            }

            100% {
                background-position: 0 0;
            }
        }

        button:after {
            z-index: -1;
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: #222;
            left: 0;
            top: 0;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <h1> Stuck on a decision? Click the button below </h1>
    <button id="redirect-button">Leave it to me</button>
    <script src="leaveittome.js"></script>
</body>

</html>
