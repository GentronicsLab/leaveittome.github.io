<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave it to me</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        body {
            background-image: url('unsure.png');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: rgb(19, 217, 231);
            position: absolute;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            /* Responsive font size: scales smoothly between mobile and desktop */
            font-size: clamp(20px, 5vw, 40px);
            background-color: rgba(0, 0, 0, 0.5);
            padding: 12px 20px;
            border-radius: 8px;
            text-align: center;
            width: 90%;
            max-width: 650px;
        }

        #redirect-button {
    position: absolute;
    top: 35%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 18px; /* Reduced from 24px */
    padding: 0.6em 1.8em; /* Reduced from 1em 2.5em */
    white-space: nowrap;
}

        /* Glowing Button Styles */
        button {
            border: none;
            outline: none;
            color: rgb(255, 255, 255);
            background: #111;
            cursor: pointer;
            position: relative;
            z-index: 0;
            border-radius: 10px;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            font-weight: bold;
        }

        button:before {
            content: "";
            background: linear-gradient(45deg,
                    #ff0000,
                    #ff7300,
                    #fffb00,
                    #48ff00,
                    #00ffd5,
                    #002bff,
                    #7a00ff,
                    #ff00c8,
                    #ff0000);
            position: absolute;
            top: -2px;
            left: -2px;
            background-size: 400%;
            z-index: -1;
            filter: blur(5px);
            -webkit-filter: blur(5px);
            width: calc(100% + 4px);
            height: calc(100% + 4px);
            animation: glowing-button-85 20s linear infinite;
            transition: opacity 0.3s ease-in-out;
            border-radius: 10px;
        }

        @keyframes glowing-button-85 {
            0% {
                background-position: 0 0;
            }

            50% {
                background-position: 400% 0;
            }

            100% {
                background-position: 0 0;
            }
        }

        button:after {
            z-index: -1;
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: #222;
            left: 0;
            top: 0;
            border-radius: 10px;
        }

        /* Dedicated mobile tweaks for maximum clarity and tap space */
        @media (max-width: 600px) {
    #redirect-button {
        font-size: 16px; /* Reduced from 22px */
        padding: 0.8em 1.5em; /* Reduced from 1.2em 2em */
        width: auto; /* Changed from 85% so it wraps tightly around the text */
    }
}
        }
    </style>
</head>

<body>
    <h1>Stuck on a decision? Click the button below</h1>
    <button id="redirect-button">Leave it to me</button>
    <script src="leaveittome.js"></script>
</body>

</html>
