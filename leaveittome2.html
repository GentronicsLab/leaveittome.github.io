<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave it to me</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        body {
            background-image: url('unsure.png');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
        }

        input[type="text"] {
            background: rgba(240, 234, 234, 0.5) !important;
            border: 2px solid aqua;
            width: 150px;
            height: 10px;
            color: rgb(0, 0, 0);
            font-size: 18px;
            font-weight: bold;
            padding: 12px 20px;
            border-radius: 9999em;
            margin-bottom: 10px;
            transition: box-shadow 0.3s;
            outline-color: rgb(0, 204, 255);
            box-shadow: 0px 0px 0px transparent;
        }

        input[type="text"]:hover,
        input[type="text"]:active {
            box-shadow: 0px 0px 50px aqua;
        }

        #container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #choice {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: inline-block;
            text-align: center;
            font-size: clamp(24px, 5vw, 40px);
        }

        #choices-form {
            position: absolute;
            top: 27%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #111;
            padding-bottom: 10px;
            width: 90%;
            max-width: 400px;
        }

        button#add-choice-btn {
            margin-top: 10px;
        }

        /* Compact Glowing Button Styling */
        button {
            padding: 0.6em 1.8em;
            font-size: 16px;
            border: none;
            outline: none;
            color: rgb(255, 255, 255);
            background: #111;
            cursor: pointer;
            position: relative;
            z-index: 0;
            border-radius: 10px;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            font-weight: bold;
        }

        button:before {
            content: "";
            background: linear-gradient(45deg,
                    #ff0000,
                    #ff7300,
                    #fffb00,
                    #48ff00,
                    #00ffd5,
                    #002bff,
                    #7a00ff,
                    #ff00c8,
                    #ff0000);
            position: absolute;
            top: -2px;
            left: -2px;
            background-size: 400%;
            z-index: -1;
            filter: blur(5px);
            -webkit-filter: blur(5px);
            width: calc(100% + 4px);
            height: calc(100% + 4px);
            animation: glowing-button-85 20s linear infinite;
            transition: opacity 0.3s ease-in-out;
            border-radius: 10px;
        }

        @keyframes glowing-button-85 {
            0% {
                background-position: 0 0;
            }

            50% {
                background-position: 400% 0;
            }

            100% {
                background-position: 0 0;
            }
        }

        button:after {
            z-index: -1;
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: #222;
            left: 0;
            top: 0;
            border-radius: 10px;
        }

        @keyframes rotation {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        #alert-dialog,
        #alert-dialogue {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            width: 260px;
            height: auto;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 20px;
            border: 2px solid aqua;
            text-align: center;
            font-size: 18px;
            border-radius: 20px;
            z-index: 1000;
        }

        #alert-dialog p {
            margin: 0 0 15px 0;
            text-align: center;
        }

        #alert-dialog.show,
        #alert-dialogue.show {
            display: block;
        }

        .choices-spin {
            text-align: center;
            font-size: 20px;
            margin-bottom: 10px;
        }

        .dialogue-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background-color: #91d3d5;
            border-radius: 20px;
            padding: 20px;
            display: none;
        }

        #play-again-btn {
            display: none;
            position: absolute;
            bottom: -70px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Mobile specific adjustments */
        @media (max-width: 600px) {
            button {
                font-size: 15px;
                padding: 0.6em 1.4em;
            }

            #choices-form {
                top: 30%;
            }
        }
    </style>
</head>

<body>
    <form id="choices-form">
        <div id="choices-container"></div>
        <button id="add-choice-btn" type="button">Add Choice</button>
        <button id="spin-btn" type="button" value="Spin my choices">Leave it to me</button>
        <div id="spin-box" class="dialogue-box"></div>
        <div id="choice"></div>
        <div id="alert-dialog">
            <p>Please provide a minimum of two choices</p>
            <button id="ok-btn" type="button">OK</button>
        </div>
        <div id="alert-playAgainDialog">
            <button id="play-again-btn" type="button">Play Again</button>
        </div>
    </form>
    <script src="leaveittome2.js"></script>
</body>

</html>
