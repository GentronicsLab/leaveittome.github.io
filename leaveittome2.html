<!DOCTYPE html>
<html>

<head>
    <title>Leave it to me</title>
    <style>
        body {
            background-image: url('unsure.png');
            background-repeat: no-repeat;
            background-size: 100% 100%;
            background-attachment: fixed;
        }

        input[type="text"] {
            background: rgba(240, 234, 234, 0.5) !important;
            border: 2px solid aqua;
            width: 150px;
            height: 10px;
            color: black(0, 204, 255);
            font-size: 20px;
            font-weight: bold; /* <--- ADD THIS LINE */
            padding: 12px 20px;
            border-radius: 9999em;
            margin-bottom: 10px;
            transition: box-shadow 0.3s;
            outline-color: rgb(0, 204, 255);
            box-shadow: 0px 0px 0px transparent;
        }

        input[type="text"]:hover,
        input[type="text"]:active {
            box-shadow: 0px 0px 50px aqua;
        }

        #container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #choice {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: inline-block;
            text-align: center;
            font-size: 40px;
        }

        #choices-form {
            position: absolute;
            top: 27%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #111;
        }

        button#add-choice-btn {
            margin-top: 10px;
            /* add 10px of margin to the top of the button */
        }

        #choices-form {
            padding-bottom: 10px;
            /* add 10px of padding to the bottom of the form */
        }





        /* CSS */
        button {
            padding: 0.6em 2em;
            border: none;
            outline: none;
            color: rgb(255, 255, 255);
            background: #111;
            cursor: pointer;
            position: relative;
            z-index: 0;
            border-radius: 10px;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        button:before {
            content: "";
            background: linear-gradient(45deg,
                    #ff0000,
                    #ff7300,
                    #fffb00,
                    #48ff00,
                    #00ffd5,
                    #002bff,
                    #7a00ff,
                    #ff00c8,
                    #ff0000);
            position: absolute;
            top: -2px;
            left: -2px;
            background-size: 400%;
            z-index: -1;
            filter: blur(5px);
            -webkit-filter: blur(5px);
            width: calc(100% + 4px);
            height: calc(100% + 4px);
            animation: glowing-button-85 20s linear infinite;
            transition: opacity 0.3s ease-in-out;
            border-radius: 10px;
        }

        @keyframes glowing-button-85 {
            0% {
                background-position: 0 0;
            }

            50% {
                background-position: 400% 0;
            }

            100% {
                background-position: 0 0;
            }
        }

        button:after {
            z-index: -1;
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: #222;
            left: 0;
            top: 0;
            border-radius: 10px;
        }




        @keyframes rotation {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        #alert-dialog {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            width: 250px;
            height: 100px;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 20px;
            border: 2px solid aqua;
            text-align: center;
            font-size: 30px;
            border-radius: 9999em;
            align-items: center;
            flex-direction: column;
            grid-template-rows: 1fr auto;
            align-items: center;
            text-align: center;
        }

        #alert-dialog p {
            text-align: center;
            position: relative;
            top: -50%;
        }

        #alert-dialog button {
            position: relative;
            top: -85%;
        }

        #alert-dialog.show {
            display: block;
        }

        #alert-dialogue.show {
            display: block;
        }

        #alert-dialogue {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            width: 250px;
            height: 100px;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 20px;
            border: 2px solid aqua;
            text-align: center;
            font-size: 30px;
            border-radius: 9999em;
        }

        .choices-spin {
            text-align: center;
            font-size: 20px;
            margin-bottom: 10px;
        }

        .dialogue-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background-color: #91d3d5;
            border-radius: 20px;
            padding: 20px;
            display: none;
        }

        #play-again-btn {
            display: none;
            position: absolute;
            bottom: -70px;
            /* adjust as needed */
            left: 50%;
            transform: translateX(-50%);
        }
    </style>
</head>

<body>
    <form id="choices-form">
        <div id="choices-container"></div>
        <button id="add-choice-btn" type="button">Add Choice</button>
        <button id="spin-btn" type="button" value="Spin my choices">Leave it to me</button>
        <div id="spin-box" class="dialogue-box">
            <!-- <button id="spin-btn"></button> -->
        </div>
        <div id="choice"></div>
        <div id="alert-dialog">
            <p>Please provide a minimum of two choices</p>
            <button id="ok-btn">OK</button>
        </div>
        <div id="alert-playAgainDialog">
            <button id="play-again-btn">Play Again</button>
        </div>
        <script src="leaveittome2.js"></script>
</body>

</html>
